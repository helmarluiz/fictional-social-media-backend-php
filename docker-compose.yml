version: "3.7"
services:
  db-mysql:
    platform: linux/amd64
    image: mysql:8.0.33
    container_name: ${COMPOSE_PROJECT_NAME}-db-mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./docker/mysql/init/schema.sql:/docker-entrypoint-initdb.d/1.sql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - php-news-backend

  backend:
    depends_on:
      - db-mysql
    environment:
      - PHP_IDE_CONFIG=serverName=php-news
    build:
      args:
        user: www
        uid: 1001
      context: ./
      dockerfile: docker/php/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    #    extra_hosts:
    #      - "host.docker.internal:host-gateway"
    ports:
      - 9003:9000
    restart: unless-stopped
    volumes:
      - ./src:/var/www/src
      - /var/www/src/vendor
    networks:
      - php-news-backend

  nginx:
    platform: linux/amd64
    depends_on:
      - backend
    image: nginx:stable
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    restart: unless-stopped
    ports:
      - 8080:80
    volumes:
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
      - ./src:/var/www/src
    networks:
      - php-news-backend

